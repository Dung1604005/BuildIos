# Mẫu workflow: biên dịch project Xcode do Unity xuất thành .ipa CHƯA KÝ.
# IosBuildPipeline tự chép file này vào Builds/iOS/.github/workflows/.
# Ký lại bằng Sideloadly/AltStore + Apple ID miễn phí trên Windows.
name: ios-unsigned

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      # IosBuildLargeFiles nén file > 50 MB thành <file>.gzpart000, 001, ... (GitHub chặn file > 100 MB): ghép và giải nén lại.
      - name: Unpack large files
        run: |
          find Xcode -name '*.gzpart000' | while IFS= read -r first; do
            base="${first%.gzpart000}"
            cat "$base".gzpart* | gunzip > "$base"
            rm "$base".gzpart*
          done

      # Windows không lưu quyền chạy; trả lại cho script và công cụ Unity đặt trong project.
      - name: Restore executable bits
        run: |
          find Xcode -maxdepth 1 -type f \( -name '*.sh' -o -name 'usymtool*' \) -exec chmod +x {} +

      - name: Pod install (chỉ khi project có Podfile)
        working-directory: Xcode
        run: |
          if [ -f Podfile ]; then pod install; fi

      - name: Build unsigned app
        working-directory: Xcode
        run: |
          if [ -d Unity-iPhone.xcworkspace ]; then
            TARGET=(-workspace Unity-iPhone.xcworkspace)
          else
            TARGET=(-project Unity-iPhone.xcodeproj)
          fi
          xcodebuild "${TARGET[@]}" -scheme Unity-iPhone \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ../build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package ipa
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          echo "App: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry IdleGo.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: IdleGo-ipa
          path: IdleGo.ipa
          retention-days: 7
